[package]
name = "bookshelfman"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
scraper = "0.29"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
wreq = { version = "0.16.1", features = [
    "brotli",
    "charset",
    "cookies",
    "deflate",
    "gzip",
    "zstd",
] }
wreq-util = "0.2"
