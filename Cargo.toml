[package]
name = "bookshelfman"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
dirs = "6"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
wreq = { version = "0.16.1", features = [
    "brotli",
    "charset",
    "cookies",
    "deflate",
    "gzip",
    "zstd",
] }
wreq-util = "0.2"
